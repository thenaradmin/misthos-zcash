[package]
name = "zec-payroll"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Private payroll rail for Zcash testnet: employees, schedules, capped pay runs"
license = "MIT"

[dependencies]
# Testnet has activated NU7 (branch id 0x77190ad9); stable zcash crates reject
# v6 txs, so pin the same prerelease line as zec-shielded-x402.
zcash_address = "=0.14.0-pre.2"
zcash_protocol = "=0.11.0-pre.1"

[[bin]]
name = "payroll"
path = "src/main.rs"
